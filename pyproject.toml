[project]
name = "international_trade_legal_document_automation"
version = "0.1.0"
description = "international_trade_legal_document_automation using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.24,<2.0.0",
    "exa-py",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/international_trade_legal_document_automation"]

[tool.crewai]
type = "flow"
definition = "src/international_trade_legal_document_automation/flow.json"
project_id = "c3b6981d-7be2-44c8-ad9e-7896dae36c18"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
